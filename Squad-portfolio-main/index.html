<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squad 125 Portfolio</title><
  <style>
    :root{--bg:#ffffff;--card:#f8f8f8;--accent:#352d2d;--muted:#555555}
    html,body{height:100%;margin:0;font-family: Arial;background:url("./class photo.jpeg") center/100% 100%}
    .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:radial-gradient(1200px 400px at 10% 10%, rgba(125,211,252,0.06), transparent), var(--card);padding:36px;border-radius:14px;box-shadow:0 6px 30px rgba(2,6,23,0.6);max-width:880px;width:100%;border:1px solid rgba(125,211,252,0.06)}
    h1{font-size:clamp(24px,4vw,40px);margin:0 0 8px}
    p.lead{color:var(--muted);margin:0 0 18px}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    a.btn{display:inline-block;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600;background:linear-gradient(90deg,var(--accent),#7a6864);color:#ffffff}
    a.ghost{background:transparent;border:1px solid rgba(239, 74, 74, 0.897);color:var(--muted);padding:10px 14px}
    footer{margin-top:18px;color:var(--muted);font-size:13px}
    @media (max-width:520px){.card{padding:20px}}
  </style>
</head>
<body>
  <main class="center">
    <section class="card" role="main">
      <header>
        <h1>Squad 125 Portfolio</h1>
        <p class="lead">Welcome to Squad 125</p>
      </header>

      <div class="actions">
        <a class="btn" href="mentors.html">Know More!</a>
        <div class="image-box">
  <img src="img" alt="Squad 125" />
</div>

      </div>
    </section>
  </main>
</body>
</html>
